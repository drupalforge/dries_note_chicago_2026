include:
  - base/docker-compose.base.yml

services:
  app:
    image: drupalforge/dries_note_chicago_2026:main
    environment:
      DP_APP_ID: 'dries_note_chicago_2026'
      APP_ROOT: '/var/www/html'
      WEB_ROOT: '/var/www/html/web'
      # Devcontainer-only unzip defaults for virtiofs metadata compatibility.
      UNZIPOPT: '-o -DD'
      CODES_USER_DATA_DIR: '/var/www/html/.vscode'
      CODES_WORKING_DIR: '/var/www/html'
      APACHE_RUN_USER: 'www'
      APACHE_RUN_GROUP: 'www'
      COMPOSER_HOME: '/home/www/.config/composer'
      CODES_ENABLE: 'no'
      DRUPALFORGE_DEVCONTAINER: 'true'
      DB_HOST: db
      DB_PORT: 3306
      DB_ROOT_PASSWORD: root
      DB_NAME: drupaldb
      DB_USER: user
      DB_PASSWORD: password
      DB_DRIVER: mysql
    volumes:
      - "..:/var/www/html"
    depends_on:
      db:
        condition: service_healthy
      init-source-code:
        condition: service_completed_successfully

  init-source-code:
    # init-source-code: imports code and DB from the image into the host bind
    # once. Its state volume prevents later Compose starts from repeating the
    # sync. Existing host files and Git metadata are preserved during the
    # import.
    image: drupalforge/dries_note_chicago_2026:main
    environment:
      APP_ROOT: /var/www/html
      DB_SYNC_VOL: 'yes'
      DRUPALFORGE_DEVCONTAINER: 'true'
      DB_HOST: db
      DB_PORT: 3306
      DB_ROOT_PASSWORD: root
      DB_NAME: drupaldb
      DB_USER: user
      DB_PASSWORD: password
      DB_DRIVER: mysql
    entrypoint:
      - sh
      - -c
      - |
        set -e
        if [ ! -f /var/lib/devcontainer-init/.complete ]; then
          "$$APP_ROOT"/.devpanel/init-container.sh
          sudo touch /var/lib/devcontainer-init/.complete
        fi
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - "..:/var/www/build"
      - "init-source-code-state:/var/lib/devcontainer-init"

volumes:
  init-source-code-state:
